<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Givny</title>
<style>
  :root { --canvas:#FAFAF7; --forest:#0C3B2E; --lime:#D9F36E; --ink:#10150F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--canvas); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .panel {
    background: linear-gradient(165deg, #0C3B2E, #0A3328);
    border-radius: 32px; padding: 48px 32px; max-width: 460px; width: 100%; text-align: center; color: #fff;
  }
  .leaf {
    width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50% 0;
    background: var(--lime); transform: rotate(45deg);
  }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { margin: 0 0 28px; color: rgba(255,255,255,0.6); line-height: 1.6; font-size: 15px; }
  button {
    background: var(--lime); color: var(--forest); border: 0; font: inherit; font-weight: 700;
    padding: 14px 28px; border-radius: 999px; cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
</style>
</head>
<body>
  <div class="panel">
    <div class="leaf"></div>
    <h1>You're offline</h1>
    <p>Givny needs a connection to show what neighbours are giving away. Your listings are safe — reconnect and pick up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
